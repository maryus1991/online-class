services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    environment:
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: >
      --log-file=stdout
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --realm=myrealm
      --user=turnuser:turnpass
      --min-port=49160
      --max-port=49300
      --listening-port=3478
      --external-ip=5.209.182.208
      --listening-ip=0.0.0.0
      --relay-ip=5.209.182.208

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app