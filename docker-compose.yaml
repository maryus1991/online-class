services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host          # خیلی مهم برای WebRTC
    environment:
      PORT: "3000"

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: >
      --log-file=stdout
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --realm=myrealm
      --user=turnuser:turnpass
      --min-port=49160
      --max-port=49300
      --listening-port=3478


