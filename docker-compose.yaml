# فقط یک سرویس: سرور Bun + ElysiaJS + mediasoup (بدون دیتابیس، Redis و LiveKit)
services:
  class:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
      # پورت‌های رسانه (WebRTC): باید با RTC_PORT_MIN..RTC_PORT_MAX هم‌خوان باشد
      - "${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40001}:${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40001}/udp"
      - "${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40001}:${RTC_PORT_MIN:-40000}-${RTC_PORT_MAX:-40001}/tcp"
